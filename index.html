<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slade.io — Quiz Your World</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at 20% 20%, #6c2cff55, transparent 30%),
            radial-gradient(circle at 80% 80%, #00e5ff44, transparent 30%),
            linear-gradient(135deg, #090019, #13002b 50%, #001c2b);
        color: white;
        overflow-x: hidden;
    }

    /* Background particles */
    .particle {
        position: fixed;
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        opacity: .4;
        animation: float 8s infinite ease-in-out;
        pointer-events: none;
    }

    @keyframes float {
        0%,100% {
            transform: translateY(0) translateX(0);
            opacity: .2;
        }
        50% {
            transform: translateY(-100px) translateX(30px);
            opacity: .8;
        }
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 6%;
        position: relative;
        z-index: 2;
    }

    .logo {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -1px;
        background: linear-gradient(90deg, #a855f7, #22d3ee);
        -webkit-background-clip: text;
        color: transparent;
    }

    .logo span {
        color: white;
    }

    .xp {
        background: #ffffff12;
        border: 1px solid #ffffff22;
        padding: 10px 18px;
        border-radius: 30px;
        backdrop-filter: blur(10px);
    }

    main {
        width: min(900px, 92%);
        margin: 50px auto;
        position: relative;
        z-index: 2;
    }

    .hero {
        text-align: center;
        margin-bottom: 35px;
    }

    .hero h1 {
        font-size: clamp(42px, 8vw, 78px);
        line-height: .95;
        font-weight: 1000;
        text-shadow: 0 0 35px #8b5cf688;
    }

    .hero h1 span {
        background: linear-gradient(90deg, #a855f7, #22d3ee, #a855f7);
        background-size: 200%;
        -webkit-background-clip: text;
        color: transparent;
        animation: gradient 3s infinite linear;
    }

    @keyframes gradient {
        to { background-position: 200%; }
    }

    .hero p {
        margin-top: 18px;
        color: #c9c2dd;
        font-size: 18px;
    }

    .card {
        background: #ffffff0b;
        border: 1px solid #ffffff1b;
        border-radius: 28px;
        padding: 30px;
        backdrop-filter: blur(18px);
        box-shadow: 0 25px 80px #00000055;
    }

    label {
        display: block;
        margin-bottom: 10px;
        font-weight: 700;
        color: #ddd5ed;
    }

    textarea {
        width: 100%;
        height: 120px;
        resize: none;
        border: 2px solid #ffffff18;
        border-radius: 18px;
        padding: 18px;
        background: #05000eaa;
        color: white;
        font-size: 17px;
        outline: none;
        transition: .2s;
    }

    textarea:focus {
        border-color: #9b5cff;
        box-shadow: 0 0 25px #8b5cf633;
    }

    .settings {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 20px;
    }

    select {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #ffffff22;
        background: #10051e;
        color: white;
        font-size: 15px;
    }

    button {
        border: none;
        cursor: pointer;
        color: white;
        font-weight: 900;
        border-radius: 16px;
        transition: .2s;
    }

    .start {
        width: 100%;
        margin-top: 22px;
        padding: 18px;
        font-size: 18px;
        background: linear-gradient(90deg, #8b5cf6, #06b6d4);
        box-shadow: 0 10px 30px #8b5cf655;
    }

    button:hover {
        transform: translateY(-3px);
        filter: brightness(1.15);
    }

    button:active {
        transform: scale(.98);
    }

    #quizScreen {
        display: none;
    }

    .quiz-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        color: #cfc6e7;
    }

    .progress {
        height: 10px;
        background: #ffffff12;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 30px;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #a855f7, #22d3ee);
        transition: .4s;
    }

    .question {
        font-size: clamp(25px, 5vw, 38px);
        font-weight: 900;
        line-height: 1.15;
        margin-bottom: 25px;
    }

    .answers {
        display: grid;
        gap: 13px;
    }

    .answer {
        text-align: left;
        padding: 18px;
        background: #ffffff0c;
        border: 2px solid #ffffff15;
        font-size: 17px;
    }

    .answer:hover {
        border-color: #9b5cff;
        background: #9b5cff18;
    }

    .answer.correct {
        background: #16a34a33;
        border-color: #22c55e;
    }

    .answer.wrong {
        background: #dc262633;
        border-color: #ef4444;
    }

    .answer:disabled {
        cursor: default;
    }

    #nextBtn {
        width: 100%;
        margin-top: 22px;
        padding: 16px;
        background: #ffffff18;
        display: none;
    }

    .stats {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin: 20px 0;
        color: #cfc6e7;
    }

    .stat strong {
        display: block;
        font-size: 25px;
        color: white;
    }

    #resultScreen {
        display: none;
        text-align: center;
    }

    .result-icon {
        font-size: 80px;
        margin-bottom: 10px;
    }

    .result-title {
        font-size: 45px;
        font-weight: 1000;
    }

    .score {
        font-size: 70px;
        font-weight: 1000;
        margin: 15px 0;
        background: linear-gradient(90deg, #a855f7, #22d3ee);
        -webkit-background-clip: text;
        color: transparent;
    }

    .again {
        padding: 16px 30px;
        margin-top: 20px;
        background: linear-gradient(90deg, #8b5cf6, #06b6d4);
    }

    .hidden {
        display: none !important;
    }

    @media(max-width: 600px) {
        .settings {
            grid-template-columns: 1fr;
        }

        .card {
            padding: 20px;
        }
    }
</style>
</head>

<body>

<script>
    for (let i = 0; i < 25; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = Math.random() * 100 + "%";
        p.style.animationDelay = Math.random() * 8 + "s";
        document.body.appendChild(p);
    }
</script>

<header>
    <div class="logo">Slade<span>.io</span></div>
    <div class="xp">⚡ XP: <strong id="xp">0</strong></div>
</header>

<main>

    <!-- HOME -->
    <section id="homeScreen">
        <div class="hero">
            <h1>Learn.<br><span>Level Up.</span></h1>
            <p>Drop a topic. Slade turns it into a quiz.</p>
        </div>

        <div class="card">
            <label>🎯 What do you want to be quizzed on?</label>

            <textarea
                id="topic"
                placeholder="Try: Space, dinosaurs, basketball, World War II, Minecraft, biology..."
            ></textarea>

            <div class="settings">
                <div>
                    <label>Difficulty</label>
                    <select id="difficulty">
                        <option>Easy</option>
                        <option selected>Medium</option>
                        <option>Hard</option>
                    </select>
                </div>

                <div>
                    <label>Questions</label>
                    <select id="questionCount">
                        <option value="5">5 Questions</option>
                        <option value="10" selected>10 Questions</option>
                        <option value="15">15 Questions</option>
                    </select>
                </div>
            </div>

            <button class="start" onclick="startQuiz()">
                🚀 CREATE MY QUIZ
            </button>
        </div>
    </section>


    <!-- QUIZ -->
    <section id="quizScreen">
        <div class="card">

            <div class="quiz-top">
                <span id="questionNumber">Question 1</span>
                <span>🔥 Streak: <strong id="streak">0</strong></span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progress"></div>
            </div>

            <div class="question" id="question">
                Loading...
            </div>

            <div class="answers" id="answers"></div>

            <button id="nextBtn" onclick="nextQuestion()">
                NEXT QUESTION →
            </button>

            <div class="stats">
                <div class="stat">
                    <strong id="score">0</strong>
                    Score
                </div>

                <div class="stat">
                    <strong id="correct">0</strong>
                    Correct
                </div>
            </div>

        </div>
    </section>


    <!-- RESULT -->
    <section id="resultScreen">
        <div class="card">

            <div class="result-icon" id="resultIcon">🏆</div>

            <div class="result-title" id="resultTitle">
                Quiz Complete!
            </div>

            <div class="score" id="finalScore">
                0/10
            </div>

            <p id="resultMessage">
                Nice work!
            </p>

            <button class="again" onclick="resetGame()">
                🔄 PLAY AGAIN
            </button>

        </div>
    </section>

</main>


<script>

let quiz = [];
let currentQuestion = 0;
let score = 0;
let correct = 0;
let streak = 0;
let totalQuestions = 10;
let playerXP = Number(localStorage.getItem("sladeXP")) || 0;

document.getElementById("xp").textContent = playerXP;


/*
========================================================
QUIZ GENERATOR
========================================================

This demo version creates questions from a small database.

To make Slade.io use real AI-generated questions, replace
this function with a call to your AI backend.
========================================================
*/

function generateQuiz(topic, difficulty, count) {

    const t = topic.toLowerCase();

    let questions = [];

    // Space
    if (t.includes("space") || t.includes("planet") || t.includes("astronomy")) {

        questions = [
            {
                q: "Which planet is known as the Red Planet?",
                a: ["Mars", "Venus", "Jupiter", "Mercury"],
                correct: 0
            },
            {
                q: "What is the largest planet in our solar system?",
                a: ["Earth", "Saturn", "Jupiter", "Neptune"],
                correct: 2
            },
            {
                q: "What is the star at the center of our solar system?",
                a: ["Sirius", "The Sun", "Polaris", "Betelgeuse"],
                correct: 1
            },
            {
                q: "Which planet has the most prominent ring system?",
                a: ["Mars", "Saturn", "Venus", "Mercury"],
                correct: 1
            },
            {
                q: "What force keeps planets in orbit around the Sun?",
                a: ["Magnetism", "Friction", "Gravity", "Electricity"],
                correct: 2
            }
        ];
    }

    // Biology
    else if (
        t.includes("biology") ||
        t.includes("cell") ||
        t.includes("science")
    ) {

        questions = [
            {
                q: "What is the basic unit of life?",
                a: ["Atom", "Cell", "Organ", "Tissue"],
                correct: 1
            },
            {
                q: "Which organ pumps blood around the human body?",
                a: ["Liver", "Brain", "Heart", "Lung"],
                correct: 2
            },
            {
                q: "What molecule carries genetic information?",
                a: ["DNA", "ATP", "Water", "Glucose"],
                correct: 0
            },
            {
                q: "Which organelle is often called the powerhouse of the cell?",
                a: ["Nucleus", "Ribosome", "Mitochondrion", "Cell wall"],
                correct: 2
            },
            {
                q: "Plants primarily use which process to convert light energy into chemical energy?",
                a: ["Respiration", "Photosynthesis", "Digestion", "Fermentation"],
                correct: 1
            }
        ];
    }

    // History
    else if (t.includes("history") || t.includes("world war")) {

        questions = [
            {
                q: "Which civilization built the pyramids at Giza?",
                a: ["Romans", "Ancient Egyptians", "Vikings", "Aztecs"],
                correct: 1
            },
            {
                q: "Which city was buried by Mount Vesuvius in AD 79?",
                a: ["Pompeii", "Athens", "Sparta", "Carthage"],
                correct: 0
            },
            {
                q: "Who was the first president of the United States?",
                a: ["Abraham Lincoln", "George Washington", "Thomas Jefferson", "John Adams"],
                correct: 1
            },
            {
                q: "Which ancient civilization developed democracy in Athens?",
                a: ["Greek", "Roman", "Persian", "Egyptian"],
                correct: 0
            },
            {
                q: "The Renaissance began in which European country?",
                a: ["France", "Spain", "Italy", "Germany"],
                correct: 2
            }
        ];
    }

    // Generic fallback
    else {

        questions = [
            {
                q: `Which statement is most closely related to ${topic}?`,
                a: [
                    `${topic} is a subject that can be studied through evidence and information.`,
                    `${topic} has no information associated with it.`,
                    `${topic} only exists in fictional stories.`,
                    `${topic} cannot be researched.`
                ],
                correct: 0
            },
            {
                q: `What is a good way to learn more about ${topic}?`,
                a: [
                    "Ignore reliable information",
                    "Use credible sources and compare evidence",
                    "Only trust random guesses",
                    "Avoid asking questions"
                ],
                correct: 1
            },
            {
                q: `When studying ${topic}, what should you do with conflicting information?`,
                a: [
                    "Compare the reliability of the sources",
                    "Always believe the first claim",
                    "Delete all information",
                    "Choose the funniest answer"
                ],
                correct: 0
            },
            {
                q: `What is an effective study strategy for ${topic}?`,
                a: [
                    "Never review anything",
                    "Memorize without understanding",
                    "Practice recalling important concepts",
                    "Avoid testing yourself"
                ],
                correct: 2
            },
            {
                q: `What makes a quiz question about ${topic} useful?`,
                a: [
                    "It has no answer",
                    "It tests a clear concept",
                    "It is completely unrelated",
                    "It contains only random words"
                ],
                correct: 1
            }
        ];
    }

    // Shuffle questions
    questions = [...questions].sort(() => Math.random() - 0.5);

    // Repeat questions if user asks for more than database contains
    const output = [];

    for (let i = 0; i < count; i++) {
        output.push(questions[i % questions.length]);
    }

    return output;
}


function startQuiz() {

    const topic = document.getElementById("topic").value.trim();

    if (!topic) {
        alert("Enter a topic first! 🎯");
        return;
    }

    const difficulty =
        document.getElementById("difficulty").value;

    totalQuestions =
        Number(document.getElementById("questionCount").value);

    quiz = generateQuiz(topic, difficulty, totalQuestions);

    currentQuestion = 0;
    score = 0;
    correct = 0;
    streak = 0;

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "block";

    showQuestion();
}


function showQuestion() {

    const q = quiz[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `Question ${currentQuestion + 1} / ${quiz.length}`;

    document.getElementById("question").textContent = q.q;

    document.getElementById("progress").style.width =
        `${((currentQuestion) / quiz.length) * 100}%`;

    document.getElementById("streak").textContent = streak;
    document.getElementById("score").textContent = score;
    document.getElementById("correct").textContent = correct;

    const answers = document.getElementById("answers");

    answers.innerHTML = "";

    document.getElementById("nextBtn").style.display = "none";

    q.a.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent =
            `${String.fromCharCode(65 + index)}. ${answer}`;

        button.onclick = () =>
            selectAnswer(button, index);

        answers.appendChild(button);
    });
}


function selectAnswer(button, selected) {

    const q = quiz[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(btn => {
        btn.disabled = true;
    });

    if (selected === q.correct) {

        button.classList.add("correct");

        correct++;

        streak++;

        score += 100 + (streak * 25);

        playerXP += 10 + streak;

        localStorage.setItem("sladeXP", playerXP);

        document.getElementById("xp").textContent = playerXP;

    } else {

        button.classList.add("wrong");

        streak = 0;

        buttons[q.correct].classList.add("correct");
    }

    document.getElementById("score").textContent = score;
    document.getElementById("correct").textContent = correct;
    document.getElementById("streak").textContent = streak;

    document.getElementById("nextBtn").style.display = "block";
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= quiz.length) {
        finishQuiz();
        return;
    }

    showQuestion();
}


function finishQuiz() {

    document.getElementById("quizScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "block";

    const percentage =
        Math.round((correct / quiz.length) * 100);

    document.getElementById("finalScore").textContent =
        `${correct}/${quiz.length}`;

    let title;
    let icon;
    let message;

    if (percentage === 100) {
        icon = "👑";
        title = "PERFECT RUN!";
        message = "Absolutely cracked. You mastered that topic.";
    }
    else if (percentage >= 80) {
        icon = "🔥";
        title = "ON FIRE!";
        message = "That was seriously impressive.";
    }
    else if (percentage >= 60) {
        icon = "⚡";
        title = "NICE RUN!";
        message = "You're getting there. One more round?";
    }
    else {
        icon = "🧠";
        title = "GOOD START!";
        message = "Every question is XP. Run it back and level up.";
    }

    document.getElementById("resultIcon").textContent = icon;
    document.getElementById("resultTitle").textContent = title;
    document.getElementById("resultMessage").textContent = message;
}


function resetGame() {

    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("homeScreen").style.display = "block";

    document.getElementById("topic").focus();
}

</script>

</body>
</html>
